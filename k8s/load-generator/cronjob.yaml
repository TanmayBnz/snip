apiVersion: batch/v1
kind: CronJob
metadata:
  name: load-generator
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: load-generator
              image: curlimages/curl:8.10.1
              command:
                - /bin/sh
                - -c
                - |
                  for i in $(seq 1 20); do
                    CODE=$(curl -s -X POST http://snip:8080/api/shorten \
                      -d "{\"url\":\"https://example.com/$RANDOM\"}" | \
                      sed -n 's/.*"code":"\([^"]*\)".*/\1/p')
                    if [ -n "$CODE" ]; then
                      curl -s -o /dev/null http://snip:8080/$CODE
                    fi
                    sleep 2
                  done
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  cpu: 50m
                  memory: 16Mi
