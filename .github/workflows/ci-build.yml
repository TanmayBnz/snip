name: CI Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/snip/**'
      - '.github/workflows/ci-build.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/snip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test ./...

  smoke:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/snip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go build -o snip .
      - name: Start server in background
        run: ./snip &
        env:
          PORT: "8080"
          DB_PATH: ":memory:"
          BASE_URL: "http://localhost:8080"
      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 20); do
            curl -s -o /dev/null localhost:8080/metrics && exit 0
            sleep 0.5
          done
          echo "server did not become ready in time" >&2
          exit 1
      - name: Create a link and follow the redirect
        run: |
          CODE=$(curl -s -X POST localhost:8080/api/shorten -d '{"url":"https://example.com"}' | jq -r .code)
          test -n "$CODE"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-redirs 0 localhost:8080/$CODE)
          test "$STATUS" = "302"

  build-and-deploy:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/snip
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/snip:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/snip:latest
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SNIP_HOST }}
          username: ubuntu
          key: ${{ secrets.SNIP_SSH_KEY }}
          script: |
            kubectl set image deployment/snip snip=${{ secrets.DOCKERHUB_USERNAME }}/snip:${{ github.sha }}
            kubectl rollout status deployment/snip --timeout=60s
